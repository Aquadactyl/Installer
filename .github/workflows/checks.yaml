name: Installer checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: bash -n deploy.sh && bash tests/deploy.sh
      - run: shellcheck --severity=error deploy.sh tests/deploy.sh tests/panel-smoke.sh
  ubuntu-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Provision Ubuntu 22.04 using the real installer
        run: docker build --file tests/host.Dockerfile --tag aquadactyl-installer-host-tests:22.04 .
